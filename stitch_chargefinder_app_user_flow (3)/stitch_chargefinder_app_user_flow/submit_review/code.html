<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<title>Chargefinder - Rate Your Experience</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-background": "#191c1e",
                    "on-primary-fixed-variant": "#005321",
                    "surface-container-high": "#e6e8ea",
                    "inverse-primary": "#4ae176",
                    "on-primary-container": "#004b1e",
                    "surface-dim": "#d8dadc",
                    "surface-container-lowest": "#ffffff",
                    "outline": "#6d7b6c",
                    "on-surface": "#191c1e",
                    "on-secondary-fixed": "#111c2d",
                    "surface-container-low": "#f2f4f6",
                    "on-tertiary-fixed": "#2a1700",
                    "on-secondary-container": "#586377",
                    "inverse-surface": "#2d3133",
                    "on-tertiary": "#ffffff",
                    "tertiary-container": "#ef9900",
                    "surface-variant": "#e0e3e5",
                    "on-error": "#ffffff",
                    "error-container": "#ffdad6",
                    "primary-fixed-dim": "#4ae176",
                    "on-tertiary-container": "#5c3800",
                    "outline-variant": "#bccbb9",
                    "surface-bright": "#f7f9fb",
                    "on-primary-fixed": "#002109",
                    "primary-container": "#22c55e",
                    "error": "#ba1a1a",
                    "primary-fixed": "#6bff8f",
                    "surface-container-highest": "#e0e3e5",
                    "secondary-container": "#d5e0f8",
                    "on-tertiary-fixed-variant": "#653e00",
                    "background": "#f7f9fb",
                    "secondary-fixed-dim": "#bcc7de",
                    "primary": "#006e2f",
                    "on-secondary": "#ffffff",
                    "tertiary": "#855300",
                    "surface-tint": "#006e2f",
                    "on-error-container": "#93000a",
                    "surface": "#f7f9fb",
                    "on-surface-variant": "#3d4a3d",
                    "secondary-fixed": "#d8e3fb",
                    "secondary": "#545f73",
                    "surface-container": "#eceef0",
                    "on-secondary-fixed-variant": "#3c475a",
                    "tertiary-fixed-dim": "#ffb95f",
                    "on-primary": "#ffffff",
                    "inverse-on-surface": "#eff1f3",
                    "tertiary-fixed": "#ffddb8"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "stack-sm": "8px",
                    "inline-gutter": "16px",
                    "safe-margin": "20px",
                    "stack-lg": "24px",
                    "stack-xs": "4px",
                    "stack-md": "16px"
            },
            "fontFamily": {
                    "headline-lg-mobile": ["Inter"],
                    "headline-lg": ["Inter"],
                    "label-bold": ["Inter"],
                    "body-sm": ["Inter"],
                    "label-sm": ["Inter"],
                    "headline-md": ["Inter"],
                    "body-lg": ["Inter"]
            },
            "fontSize": {
                    "headline-lg-mobile": ["24px", {"lineHeight": "30px", "fontWeight": "700"}],
                    "headline-lg": ["28px", {"lineHeight": "34px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "label-bold": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                    "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "label-sm": ["12px", {"lineHeight": "16px", "fontWeight": "400"}],
                    "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                    "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f9fb;
            -webkit-tap-highlight-color: transparent;
        }
        .rating-btn-active-pos {
            background-color: #22c55e !important;
            color: white !important;
            border-color: #22c55e !important;
            transform: scale(1.05);
        }
        .rating-btn-active-neg {
            background-color: #ffdad6 !important;
            color: #ba1a1a !important;
            border-color: #ba1a1a !important;
            transform: scale(1.05);
        }
        .sticky-cta-container {
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="text-on-surface">
<!-- TopAppBar -->
<header class="bg-surface/95 dark:bg-surface-dim/95 backdrop-blur-md border-b border-outline-variant dark:border-outline docked full-width top-0 sticky flex items-center justify-between px-safe-margin h-16 w-full z-50">
<div class="flex items-center gap-4">
<button class="text-primary dark:text-primary-fixed-dim hover:bg-surface-container-high dark:hover:bg-surface-container-highest transition-colors active:scale-95 duration-100 p-2 rounded-full">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed-dim">How was your charge?</h1>
</div>
</header>
<main class="max-w-md mx-auto px-safe-margin pt-stack-lg pb-32">
<!-- Station Summary Card -->
<section class="mb-stack-lg">
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-stack-md shadow-sm">
<div class="flex justify-between items-start mb-stack-sm">
<div>
<h2 class="font-headline-md text-headline-md text-on-surface">Ionity Supercharger</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant">Berlin South Gateway, Germany</p>
</div>
<div class="bg-primary-container text-on-primary-container px-3 py-1 rounded-full font-label-bold text-label-bold">
                        COMPLETED
                    </div>
</div>
<div class="grid grid-cols-2 gap-4 mt-stack-md pt-stack-md border-t border-outline-variant">
<div>
<p class="font-label-sm text-label-sm text-secondary uppercase tracking-wider">Energy</p>
<p class="font-headline-md text-headline-md text-on-surface">42.5 kWh</p>
</div>
<div>
<p class="font-label-sm text-label-sm text-secondary uppercase tracking-wider">Total Cost</p>
<p class="font-headline-md text-headline-md text-on-surface">€24.65</p>
</div>
<div class="col-span-2">
<p class="font-label-sm text-label-sm text-secondary uppercase tracking-wider">Date</p>
<p class="font-body-lg text-body-lg text-on-surface">Oct 24, 2023 • 14:22 - 14:58</p>
</div>
</div>
</div>
</section>
<!-- Phase 1: Binary Rating -->
<section class="mb-stack-lg">
<h3 class="font-headline-md text-headline-md text-center mb-stack-md">How was your charging experience?</h3>
<div class="flex gap-4">
<button class="flex-1 flex flex-col items-center justify-center py-stack-lg bg-surface-container-lowest border border-outline-variant rounded-xl transition-all duration-200 active:scale-95 group" id="btn-thumbs-up" onclick="selectRating('positive')">
<span class="material-symbols-outlined text-[48px] text-primary mb-2 group-hover:scale-110 transition-transform" data-icon="thumb_up">thumb_up</span>
<span class="font-label-bold text-label-bold text-on-surface-variant">THUMBS UP</span>
</button>
<button class="flex-1 flex flex-col items-center justify-center py-stack-lg bg-surface-container-lowest border border-outline-variant rounded-xl transition-all duration-200 active:scale-95 group" id="btn-thumbs-down" onclick="selectRating('negative')">
<span class="material-symbols-outlined text-[48px] text-secondary mb-2 group-hover:scale-110 transition-transform" data-icon="thumb_down">thumb_down</span>
<span class="font-label-bold text-label-bold text-on-surface-variant">THUMBS DOWN</span>
</button>
</div>
</section>
<!-- Phase 2: Conditional Feedback -->
<section class="space-y-stack-sm">
<label class="font-label-bold text-label-bold text-on-surface-variant px-1" for="review-text">TELL US MORE (OPTIONAL)</label>
<div class="relative">
<textarea class="w-full bg-surface-container-lowest border border-outline-variant rounded-xl p-stack-md font-body-lg text-body-lg focus:ring-2 focus:ring-primary focus:border-transparent transition-all outline-none resize-none" id="review-text" placeholder="Tell us about the station, availability, or any issues you encountered..." rows="4"></textarea>
</div>
<!-- Quick Chips -->
<div class="flex flex-wrap gap-2 pt-stack-sm">
<button class="px-4 py-2 bg-surface-container border border-outline-variant rounded-full font-label-sm text-label-sm text-on-surface hover:bg-surface-variant transition-colors" onclick="addChipText('Charger was fast')">Charger was fast</button>
<button class="px-4 py-2 bg-surface-container border border-outline-variant rounded-full font-label-sm text-label-sm text-on-surface hover:bg-surface-variant transition-colors" onclick="addChipText('Easy to find')">Easy to find</button>
<button class="px-4 py-2 bg-surface-container border border-outline-variant rounded-full font-label-sm text-label-sm text-on-surface hover:bg-surface-variant transition-colors" onclick="addChipText('Clean area')">Clean area</button>
<button class="px-4 py-2 bg-surface-container border border-outline-variant rounded-full font-label-sm text-label-sm text-on-surface hover:bg-surface-variant transition-colors" onclick="addChipText('App worked perfectly')">App worked perfectly</button>
</div>
</section>
</main>
<!-- Sticky Bottom CTA -->
<div class="fixed bottom-0 left-0 w-full p-safe-margin bg-surface/95 sticky-cta-container border-t border-outline-variant z-40">
<div class="max-w-md mx-auto">
<button class="w-full py-4 bg-primary text-on-primary font-headline-md text-headline-md rounded-xl shadow-md active:scale-[0.98] transition-transform duration-100 flex items-center justify-center gap-2">
                Submit Review
                <span class="material-symbols-outlined" data-icon="send">send</span>
</button>
<p class="text-center mt-stack-sm font-label-sm text-label-sm text-on-surface-variant opacity-70">
                Your feedback helps thousands of EV drivers
            </p>
</div>
</div>
<!-- Background Decoration -->
<div class="fixed top-0 left-0 w-full h-full -z-10 pointer-events-none opacity-20">

</div>
<script>
        let selectedRatingValue = null;

        function selectRating(type) {
            const upBtn = document.getElementById('btn-thumbs-up');
            const downBtn = document.getElementById('btn-thumbs-down');
            
            // Reset states
            upBtn.classList.remove('rating-btn-active-pos');
            downBtn.classList.remove('rating-btn-active-neg');
            
            if (type === 'positive') {
                upBtn.classList.add('rating-btn-active-pos');
                selectedRatingValue = 'positive';
            } else {
                downBtn.classList.add('rating-btn-active-neg');
                selectedRatingValue = 'negative';
            }
            
            // Haptic feedback simulation
            if (window.navigator.vibrate) {
                window.navigator.vibrate(10);
            }
        }

        function addChipText(text) {
            const textarea = document.getElementById('review-text');
            if (textarea.value.length > 0) {
                textarea.value += ' ' + text + '.';
            } else {
                textarea.value = text + '.';
            }
            textarea.focus();
        }

        // Simple Fade-in effect on load
        document.addEventListener('DOMContentLoaded', () => {
            const elements = document.querySelectorAll('section');
            elements.forEach((el, index) => {
                el.style.opacity = '0';
                el.style.transform = 'translateY(20px)';
                el.style.transition = `all 0.5s ease ${index * 0.1}s`;
                setTimeout(() => {
                    el.style.opacity = '1';
                    el.style.transform = 'translateY(0)';
                }, 100);
            });
        });
    </script>
</body></html>
