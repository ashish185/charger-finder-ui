                Navigate to Station
            </button>
</div>

<!-- Hidden Navigation Logic (As per "The Filter" suppression rule) -->
<!-- The BottomNavBar is suppressed here because this is a focused "Success/Confirmation" task screen. -->
<script>
        // Micro-interaction for the "Navigate" button
        document.querySelector('button.bg-primary').addEventListener('click', function() {
            const originalContent = this.innerHTML;
            this.innerHTML = '<span class="material-symbols-outlined animate-spin" data-icon="progress_activity">progress_activity</span> Opening Maps...';
            setTimeout(() => {
                this.innerHTML = originalContent;
            }, 1500);
        });

        // Simulating ripple for items
        const interactiveElements = document.querySelectorAll('.active\\:scale-95');
        interactiveElements.forEach(el => {
            el.addEventListener('touchstart', () => el.classList.add('opacity-80'));
            el.addEventListener('touchend', () => el.classList.remove('opacity-80'));
        });
    </script>
